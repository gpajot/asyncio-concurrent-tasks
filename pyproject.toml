[project]
name = "concurrent-tasks"
version = "1.18.0"
description = "Tools to run asyncio tasks concurrently."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gabriel Pajot", email = "gab@lescactus.eu" },
]
urls = { repository = "https://github.com/gpajot/asyncio-concurrent-tasks" }
dependencies = []
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-mock==3.17.0",
    "ruff==0.17.2",
    "ty==0.0.95",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "PT", "RUF", "UP"]
ignore = ["E501", "RUF001"]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.uv]
build-backend = { module-name = "concurrent_tasks", module-root = "" }

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.ty.terminal]
error-on-warning = true
[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
